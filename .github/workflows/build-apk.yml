name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Generate Android Icons
        run: npm run assets:generate

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi
          printf "%s" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Verify google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found."
            ls -lh android/app/google-services.json
          else
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Verify google-services.json after sync
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json still exists after sync."
            ls -lh android/app/google-services.json
          else
            echo "ERROR: google-services.json disappeared after Capacitor sync."
            exit 1
          fi

      - name: Download Clean Gradle Wrapper Jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fundora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
